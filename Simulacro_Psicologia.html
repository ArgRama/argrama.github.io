<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulacro Psicología UNMdP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#eef2f7; --paper:#ffffff; --ink:#15202f; --muted:#5a6679; --line:#d6dde8;
  --accent:#0b5394; --accent-ink:#ffffff; --accent-soft:#dfe9f5;
  --ok:#1d7447; --ok-soft:#e1f2e8; --bad:#b0301f; --bad-soft:#fbe7e3;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e131b; --paper:#161d28; --ink:#e5eaf1; --muted:#98a4b7; --line:#2a3445;
    --accent:#72a9e0; --accent-ink:#0e131b; --accent-soft:#1b2a3e;
    --ok:#61c592; --ok-soft:#15291f; --bad:#f08b7e; --bad-soft:#2f1b18;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e131b; --paper:#161d28; --ink:#e5eaf1; --muted:#98a4b7; --line:#2a3445;
  --accent:#72a9e0; --accent-ink:#0e131b; --accent-soft:#1b2a3e;
  --ok:#61c592; --ok-soft:#15291f; --bad:#f08b7e; --bad-soft:#2f1b18;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:28px 120px}
header .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(28px,5vw,38px);line-height:1.1;margin:6px 0 8px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 20px;max-width:62ch}
.sub b{color:var(--ink);font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:24px}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{font:500 14px var(--sans);border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{font:500 14px var(--sans);border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 14px;border-radius:9px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tandas{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:22px}
.tandas .tl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:8px}
.trow{display:flex;flex-wrap:wrap;gap:6px}
.trow button{font:500 14px var(--mono);min-width:40px;height:36px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;cursor:pointer;position:relative}
.trow button:hover{border-color:var(--accent)}
.trow button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.trow button.done-ok::after,.trow button.done-bad::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%}
.trow button.done-ok::after{background:var(--ok)} .trow button.done-bad::after{background:var(--bad)}
.tname{margin-top:10px;font-size:14px}
.tname b{font-weight:600}
.tname span{color:var(--muted)}
.modehint{font-size:13px;color:var(--muted);margin:-12px 0 20px}

.results{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:28px}
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 18px}
.score .big{font-family:var(--serif);font-size:48px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums}
.score .pct{font-family:var(--mono);color:var(--muted)}
.verdict{font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)} .verdict.bad{background:var(--bad-soft);color:var(--bad)}
.meter{position:relative;height:10px;background:var(--accent-soft);border-radius:6px;margin:18px 0 6px;overflow:visible}
.meter .fill{height:100%;border-radius:6px;background:var(--accent)}
.meter .mark{position:absolute;left:60%;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.meter-l{display:flex;justify-content:space-between;font:500 12px var(--mono);color:var(--muted)}
.meter-l span:nth-child(2){position:relative;left:10%}
.bd{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.bd div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bd .n{font:500 18px var(--mono);font-variant-numeric:tabular-nums}
.bd .l{font-size:12px;color:var(--muted)}
.results .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.results .note{font-size:13px;color:var(--muted);margin-top:12px}

ol.qs{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px}
.q.right{border-color:var(--ok)} .q.wrong{border-color:var(--bad)}
.qhead{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.num{font:500 13px var(--mono);color:var(--accent)}
.chip{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.qtext{font-family:var(--serif);font-size:18px;line-height:1.45;margin:0 0 14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;font:15px var(--sans);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer}
.opt .k{font:500 13px var(--mono);color:var(--muted);min-width:1.2em}
.opt:hover{border-color:var(--accent)}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.is-right{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.write input{width:100%;font:16px var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 12px}
.write input:disabled{opacity:.85}
.fb{margin-top:12px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.fb .tag{font-weight:600}
.fb .tag.ok{color:var(--ok)} .fb .tag.bad{color:var(--bad)}
.fb .exp b{font-weight:600}
.linkbtn{font:500 13px var(--sans);background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:14px;justify-content:space-between}
.prog{flex:1;min-width:0}
.bbtns{display:flex;gap:8px}
.prog .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .track{height:4px;background:var(--accent-soft);border-radius:3px;margin-top:6px}
.prog .track i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .2s}
@media (prefers-reduced-motion:reduce){.prog .track i{transition:none}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="eyebrow">Psicología · Escuela Superior de Medicina · UNMdP</div>
    <h1>Simulacro de parcial</h1>
    <p class="sub">Las 131 consignas de los Teóricos 1 a 5, ordenadas por importancia en 7 tandas. La primera tiene lo que tenés que saber sí o sí; cada tanda siguiente es un poco menos central. <b>Cada tanda se aprueba con el 60 %.</b></p>
  </header>

  <div class="controls">
    <div class="seg" role="group" aria-label="Forma de responder">
      <button id="m-mc" type="button" aria-pressed="true">Opción múltiple</button>
      <button id="m-wr" type="button" aria-pressed="false">Escribir la respuesta</button>
    </div>
    <button id="reiniciar" class="btn" type="button">Reiniciar desde la tanda 1</button>
  </div>
  <nav class="tandas" aria-label="Tandas"><div class="tl">Tanda</div><div class="trow" id="trow"></div><div class="tname" id="tname"></div></nav>
  <p class="modehint" id="modehint"></p>

  <section id="results" class="results" hidden aria-live="polite"></section>
  <ol class="qs" id="qs"></ol>
</div>

<div class="bar"><div class="in">
  <div class="prog"><div class="t" id="progt"></div><div class="track"><i id="progbar"></i></div></div>
  <div class="bbtns"><button id="reiniciar2" class="btn" type="button" aria-label="Reiniciar desde la tanda 1">Reiniciar</button><button id="entregar" class="btn primary" type="button">Entregar</button></div>
</div></div>

<script>
const BANK = [{"t":"T1","q":"¿Cómo se denomina el concepto que, lejos de ser una interioridad aislada, alude a la interacción continua entre el mundo interno del sujeto y la realidad externa, siendo el ser humano producto de la historia, el lenguaje y los contextos institucionales?","a":"Subjetividad","alts":["Subjetividad"]},{"t":"T1","q":"Según Pichon Rivière, ¿cómo se denomina la herramienta teórica que distribuye las vivencias y conflictos del ser humano en tres áreas de conducta diferenciadas pero integradas: mente, cuerpo y mundo exterior?","a":"Esquema de los tres círculos concéntricos (áreas de la conducta)","alts":["Esquema de los tres círculos concéntricos","áreas de la conducta"]},{"t":"T1","q":"Según Lacan, ¿cómo se denomina la tendencia estructural, inexorable y universal de la constitución psíquica, caracterizada por la rivalidad imaginaria y la ambivalencia u hostilidad hacia el semejante?","a":"Agresividad","alts":["Agresividad"]},{"t":"T1","q":"Según Lacan, ¿cómo se denomina la materialización o paso al acto concreto de la tendencia hostil, a través de ofensas o violencia?","a":"Agresión","alts":["Agresión"]},{"t":"T1","q":"En el marco lacaniano, ¿cómo se denomina la violencia que funciona como un espejo, en la que ante un insulto se responde con la misma hostilidad, y que puede romperse mediante el lenguaje?","a":"Violencia especular","alts":["Violencia especular"]},{"t":"T1","q":"Según Derrida, ¿cómo se denomina la noción rescatada del diccionario Littré, con alcance gramatical y maquínico, que alude a desensamblar las partes de un todo, como se desarma una máquina para transportarla?","a":"Deconstrucción","alts":["Deconstrucción"]},{"t":"T1","q":"¿Cuáles son las dos nociones de la filosofía de Heidegger que Derrida buscaba traducir, y que aludían al desmontaje de la estructura conceptual de la ontología occidental?","a":"Destruktion y Abbau","alts":["Destruktion y Abbau"]},{"t":"T1","q":"¿Cómo se denominan las precisiones que, para evitar reduccionismos, señalan lo que la deconstrucción no es (no es destrucción, ni método, ni crítica trascendental, ni pantextualismo, ni teología negativa)?","a":"Pautas negativas","alts":["Pautas negativas"]},{"t":"T1","q":"Entre las pautas negativas de la deconstrucción, ¿cómo se denomina la postura que niega la realidad material reduciéndola al texto?","a":"Panlingüismo o pantextualismo","alts":["Panlingüismo o pantextualismo","Panlingüismo","pantextualismo"]},{"t":"T1","q":"¿Cómo se denomina el modelo de salud mental, basado en el encierro monovalente, que fue deconstruido por la Ley Nacional de Salud Mental para dar lugar a dispositivos comunitarios e interdisciplinarios?","a":"Modelo asilar","alts":["Modelo asilar"]},{"t":"T1","q":"¿Cómo se denomina la función que cumplió durante siglos la medicina al naturalizar o patologizar las identidades que se desviaban de la norma, usando la taxonomía biológica para justificar la subordinación femenina?","a":"Dispositivo de control social","alts":["Dispositivo de control social"]},{"t":"T1","q":"Según Loria, ¿cómo se denomina el movimiento que se desmarca del estructuralismo rígido para desedimentar las estructuras institucionales anquilosadas?","a":"Deconstrucción","alts":["Deconstrucción"]},{"t":"T1","q":"Según Loria, ¿cómo se denomina al agente de salud que no acepta pasivamente lo instituido, somete a crítica racional los juegos de poder y los valores mercantilistas, y busca reinventar la práctica mediante un diálogo auténtico con la diferencia?","a":"Agente deconstructor","alts":["Agente deconstructor"]},{"t":"T1","q":"¿Cómo se denomina la propuesta de la Escuela Superior de Medicina que desensambla la enseñanza fragmentada entre ciencias básicas y clínica para reconstruirla en un mosaico integrado por problemas sociosanitarios?","a":"Currícula Innovada","alts":["Currícula Innovada"]},{"t":"T1","q":"¿Cómo se denomina el modelo de relación médico-paciente que debe deconstruirse para dar lugar a un vínculo horizontal basado en la escucha activa y el respeto?","a":"Modelo paternalista (y hegemónico)","alts":["Modelo paternalista"]},{"t":"T1","q":"Según Pichon Rivière, ¿cómo se denomina el área 2 del esquema de los tres círculos concéntricos?","a":"Cuerpo","alts":["Cuerpo"]},{"t":"T1","q":"Según Pichon Rivière, ¿cómo se denomina el área 3 del esquema?","a":"Mundo exterior","alts":["Mundo exterior"]},{"t":"T1","q":"A partir del esquema de Pichon Rivière, ¿cómo se concibe la enfermedad cuando se afirma que no es una tragedia biológica aislada ni un destino inexorable, sino un proceso donde lo psíquico, lo físico y lo social condicionan la salud?","a":"Acontecer multicausal","alts":["Acontecer multicausal"]},{"t":"T1","q":"Según Lacan, ¿qué rasgo caracteriza a la agresividad y la diferencia de la simple hostilidad hacia un otro concreto: se trata de una rivalidad de qué tipo?","a":"Rivalidad imaginaria","alts":["Rivalidad imaginaria"]},{"t":"T1","q":"¿Qué filósofo francés creó la noción de deconstrucción a mediados de la década de 1960?","a":"Jacques Derrida","alts":["Jacques Derrida"]},{"t":"T1","q":"¿En qué obra lexicográfica encontró Derrida el término deconstrucción?","a":"Diccionario Littré","alts":["Diccionario Littré"]},{"t":"T1","q":"¿Qué traducción literal descartó Derrida por sugerir una demolición o aniquilamiento más cercano a la propuesta nietzscheana?","a":"Destrucción","alts":["Destrucción"]},{"t":"T1","q":"¿Qué dos alcances tiene la palabra deconstrucción en el diccionario Littré (desarmar una máquina / descomponer la sintaxis de una frase)?","a":"Maquínico y gramatical","alts":["Maquínico y gramatical"]},{"t":"T1","q":"Según las pautas negativas, la deconstrucción no es una técnica instrumental con reglas fijas y repetibles, porque normativizarla sería estructurar la desestructuración. ¿Qué es lo que no es?","a":"Un método","alts":["Un método"]},{"t":"T1","q":"Según las pautas negativas, ¿cómo se denomina el mero análisis que retrocede hacia un elemento primigenio indivisible?","a":"Análisis regresivo","alts":["Análisis regresivo"]},{"t":"T1","q":"¿Qué noción pasó de designar un tipo de tela a constituirse en una categoría teórica que desnaturalizó la ecuación biológica estricta?","a":"Género","alts":["Género"]},{"t":"T1","q":"¿Qué ley deconstruyó el modelo asilar de encierro monovalente?","a":"Ley Nacional de Salud Mental","alts":["Ley Nacional de Salud Mental"]},{"t":"T1","q":"Según Loria, ¿cómo se describe la acción de la deconstrucción sobre las estructuras institucionales anquilosadas?","a":"Desedimentar","alts":["Desedimentar"]},{"t":"T1","q":"¿Cómo se denomina la estructura de enseñanza médica que durante más de nueve siglos dividió rígidamente las ciencias básicas de la clínica?","a":"Estructura fragmentada (enseñanza tradicional)","alts":["Estructura fragmentada","enseñanza tradicional"]},{"t":"T1","q":"¿Cómo se concibe el acto diagnóstico cuando se lo reconoce atravesado por sesgos sociales y condicionamientos culturales, y no como una etiqueta biológica pura?","a":"Construcción discursiva","alts":["Construcción discursiva"]},{"t":"T1","q":"¿Cómo se denomina el tipo de vínculo médico-paciente, basado en la escucha activa y el respeto, que debe reemplazar al modelo paternalista?","a":"Vínculo horizontal","alts":["Vínculo horizontal"]},{"t":"T1","q":"¿Qué recurso utilizó el saber médico para justificar la subordinación femenina o imponer patrones corporales rígidos?","a":"Taxonomía biológica","alts":["Taxonomía biológica"]},{"t":"T23","q":"¿Cómo se denomina la operación epistemológica y pedagógica que aísla, simplifica o recorta un fragmento de la realidad para hacerlo más entendible, y cuyo riesgo es tomar la parte por la totalidad?","a":"Reduccionismo","alts":["Reduccionismo"]},{"t":"T23","q":"Según Lacan, ¿cómo se denomina aquello que escapa a toda simbolización, lo incalculable, lo imprevisto y el trauma que excede las explicaciones teóricas?","a":"Lo Real","alts":["Lo Real"]},{"t":"T23","q":"Según Lacan, ¿cómo se denomina el orden constituido por el lenguaje y las categorías teóricas, que funciona como una red conceptual que intenta dar sentido a la existencia?","a":"Orden simbólico","alts":["Orden simbólico"]},{"t":"T23","q":"Según Areta, ¿con qué metáfora pedagógica se explica que las ciencias sociales ajustan su foco para observar los mismos fenómenos desde distintos niveles de resolución, de lo macro a lo micro?","a":"Metáfora del microscopio óptico (y de Google Maps)","alts":["Metáfora del microscopio óptico"]},{"t":"T23","q":"Según la cátedra, ¿cómo deben entenderse lo social, lo comunitario y lo institucional, en lugar de capas aisladas y jerárquicas, dado que operan al mismo tiempo y en el mismo espacio?","a":"Registros transversales y simultáneos","alts":["Registros transversales y simultáneos"]},{"t":"T23","q":"Según Moscovici, ¿cómo se denomina la mirada propia de la psicología social que rompe con la dicotomía sujeto-objeto al relacionar un sujeto individual, un sujeto social (el Otro) y el objeto?","a":"Lectura ternaria (visión psicosocial)","alts":["Lectura ternaria","visión psicosocial"]},{"t":"T23","q":"¿Cómo se denomina la capacidad humana universal de simbolizar?","a":"Lenguaje","alts":["Lenguaje"]},{"t":"T23","q":"¿Cómo se denomina la variante del lenguaje compartida por una comunidad específica?","a":"Lengua","alts":["Lengua"]},{"t":"T23","q":"¿Cómo se denominan las expresiones de las tensiones ideológicas y disputas que compiten por definir la realidad?","a":"Discursos","alts":["Discursos"]},{"t":"T23","q":"Según Areta, ¿cómo se denomina el proceso por el cual la subjetividad se constituye a partir de cómo otros nos ven, nos nombran y nos categorizan?","a":"Heteropercepción","alts":["Heteropercepción"]},{"t":"T23","q":"Según Areta, ¿cómo se denomina la tendencia a proyectar lo comunitario siempre en colectivos ajenos, como la comunidad gitana o boliviana, por la dificultad de reconocer la propia pertenencia colectiva?","a":"Xenopercepción (o heteropercepción)","alts":["Xenopercepción","heteropercepción"]},{"t":"T23","q":"Según Maritza Montero, ¿cómo se denomina la rama de la psicología centrada en el fortalecimiento, la autogestión y el rol activo de la comunidad en la transformación de sus condiciones de vida?","a":"Psicología comunitaria","alts":["Psicología comunitaria"]},{"t":"T23","q":"Según Montero, ¿cómo se denomina la condición por la cual los integrantes de la comunidad participan con voz, voto y veto en el diseño, ejecución y evaluación de los proyectos?","a":"Rol activo de la comunidad","alts":["Rol activo de la comunidad"]},{"t":"T23","q":"En la psicología comunitaria de Montero, ¿cómo se denomina la metodología que promueve el autodesarrollo y el empoderamiento social investigando junto con la propia comunidad?","a":"Investigación Acción Participativa","alts":["Investigación Acción Participativa"]},{"t":"T23","q":"¿Cómo se denomina el registro del territorio configurado por el lenguaje compartido, los modismos locales, la historia del barrio y las pautas culturales?","a":"Territorio simbólico","alts":["Territorio simbólico"]},{"t":"T23","q":"¿Cómo se denomina el registro del territorio que abarca las representaciones sociales, los mitos urbanos y los sentimientos de pertenencia que unen a la población?","a":"Territorio imaginario","alts":["Territorio imaginario"]},{"t":"T23","q":"¿Cómo se denomina el registro del territorio que abarca la geografía concreta, las calles, la infraestructura, la vivienda y el CAPS?","a":"Territorio real","alts":["Territorio real"]},{"t":"T23","q":"Según Ana María Fernández, ¿cómo se denominan los paradigmas en que quedaron atrapadas las ciencias sociales, que dividen la realidad en pares antitéticos como individuo-sociedad o naturaleza-cultura?","a":"Paradigmas disyuntivos","alts":["Paradigmas disyuntivos"]},{"t":"T23","q":"Según Ana María Fernández, ¿cómo se denomina el reduccionismo que concibe al sujeto como un mero reflejo pasivo de la estructura social, anulando la singularidad psíquica?","a":"Sociologismo","alts":["Sociologismo"]},{"t":"T23","q":"Según Ana María Fernández, ¿cómo se denomina el reduccionismo que explica los fenómenos sociales centrándose exclusivamente en el individuo?","a":"Psicologismo","alts":["Psicologismo"]},{"t":"T23","q":"Según Ana María Fernández, ¿qué categoría se ubica como intermediaria o nudo organizador capaz de articular lo singular y lo colectivo?","a":"El grupo","alts":["El grupo"]},{"t":"T23","q":"¿Qué autor, considerado el fundador de la psicología social en la Argentina, nació en Suiza, creció en Chaco y Corrientes y aprendió primero a hablar en guaraní?","a":"Enrique Pichon Rivière","alts":["Enrique Pichon Rivière"]},{"t":"T23","q":"Según Pichon Rivière, ¿cómo se denomina el conjunto organizado de conceptos teóricos generales referidos a un sector delimitado de lo real, que permite una aproximación instrumental e intervencionista?","a":"E.C.R.O. (Esquema Conceptual, Referencial y Operativo)","alts":["ECRO","E.C.R.O.","Esquema Conceptual, Referencial y Operativo","Esquema Conceptual Referencial Operativo"]},{"t":"T23","q":"Según Pichon Rivière, ¿cómo se denomina la forma en que avanza el conocimiento, que no es estático sino que está en constante rectificación y aprendizaje?","a":"Espiral dialéctica","alts":["Espiral dialéctica"]},{"t":"T23","q":"En el E.C.R.O. de Pichon Rivière, ¿cómo se denomina el aspecto compuesto por los elementos motivacionales, emocionales, afectivos y la experiencia de vida del profesional?","a":"Aspecto infraestructural","alts":["Aspecto infraestructural"]},{"t":"T23","q":"Según Pichon Rivière, ¿cómo se denomina la finalidad del E.C.R.O.?","a":"Operatividad","alts":["Operatividad"]},{"t":"T23","q":"Según Pichon Rivière, ¿cómo se denomina el proceso en el que el sujeto no solo se transforma a sí mismo sino que modifica creativamente su medio social?","a":"Adaptación activa a la realidad","alts":["Adaptación activa a la realidad"]},{"t":"T23","q":"Según Pichon Rivière, ¿cómo se denomina el conjunto restringido de personas ligadas por constantes de tiempo y espacio, articuladas por su mutua representación interna, que se proponen realizar una tarea?","a":"Grupo operativo","alts":["Grupo operativo"]},{"t":"T23","q":"¿Cómo se denomina la experiencia de 1958 que demostró que a mayor heterogeneidad de los integrantes, mejor es la tarea grupal?","a":"Experiencia Rosario","alts":["Experiencia Rosario"]},{"t":"T23","q":"En el grupo operativo, ¿cómo se denomina la tarea que consiste en elaborar las ansiedades e interrupciones afectivas que dificultan el aprendizaje?","a":"Tarea implícita","alts":["Tarea implícita"]},{"t":"T23","q":"Según Pichon Rivière, ¿cómo se denomina la ansiedad básica provocada por el temor a perder el estado de equilibrio o los conocimientos adquiridos?","a":"Ansiedad depresiva (miedo a la pérdida)","alts":["Ansiedad depresiva","miedo a la pérdida"]},{"t":"T23","q":"Según Pichon Rivière, ¿cómo se denomina el fenómeno grupal desencadenado por la emergencia de las ansiedades paranoide y depresiva?","a":"Resistencia al cambio","alts":["Resistencia al cambio"]},{"t":"T23","q":"Según Pichon Rivière, ¿cómo se denominan los obstáculos que corresponden a las resistencias afectivas o miedos emocionales del sujeto frente al objeto de estudio?","a":"Obstáculos epistemofílicos","alts":["Obstáculos epistemofílicos"]},{"t":"T23","q":"Según Pichon Rivière, ¿cómo se denomina el rol del integrante que expresa lo que está latente o implícito en el grupo?","a":"Portavoz","alts":["Portavoz"]},{"t":"T23","q":"Según Pichon Rivière, ¿cómo se denomina el rol sobre el que se proyectan las culpas, los miedos y los aspectos negativos del grupo?","a":"Chivo emisario","alts":["Chivo emisario"]},{"t":"T23","q":"Según Pichon Rivière, ¿cómo se denominan los mecanismos por los cuales surgen los roles informales en el grupo?","a":"Asunción y adjudicación de roles","alts":["Asunción y adjudicación de roles"]},{"t":"T23","q":"Según Pichon Rivière, ¿cómo se denomina el tipo de liderazgo de actitud permisiva que abandona la conducción del grupo a la deriva?","a":"Laissez-faire","alts":["Laissez-faire"]},{"t":"T23","q":"Según Ulloa, ¿cómo se definen los organismos dotados de una geografía, una ordenación del tiempo y una distribución de responsabilidades, regulados por un código y normas explícitas e implícitas?","a":"Instituciones (como organizaciones)","alts":["Instituciones","Institución","Organizaciones","Institución como organización"]},{"t":"T23","q":"Según Ulloa, ¿cómo se denominan las modalidades de comunicación institucional que circulan por fuera de los canales formales, como el rumor o el chiste?","a":"Modalidades clandestinas de comunicación","alts":["Modalidades clandestinas de comunicación"]},{"t":"T23","q":"Según Ulloa, ¿cómo se denominan los puntos de contacto regulados por normas sobre los que se asientan los movimientos de integración y dispersión institucional?","a":"Articulaciones","alts":["Articulaciones"]},{"t":"T23","q":"Según Ulloa, ¿cómo se denomina la perturbación de una articulación, sobre la cual se organiza la patología institucional y la mortificación de sus miembros?","a":"Fractura (articular)","alts":["Fractura","Fractura articular","Fracturas"]},{"t":"T23","q":"Según Ulloa, ¿qué tipo de fractura se evidencia en el traspaso de guardia médica?","a":"Fractura temporal","alts":["Fractura temporal"]},{"t":"T23","q":"Según Ana María Fernández, ¿cómo se denomina la fuerza transformadora, crítica e innovadora que introducen los actores al cuestionar lo establecido?","a":"Lo instituyente","alts":["Lo instituyente"]},{"t":"T23","q":"Según Ana María Fernández, ¿cómo se denomina el conjunto de normas, valores, tradiciones e historias oficiales que preexisten a la llegada de los nuevos sujetos?","a":"Lo instituido","alts":["Lo instituido"]},{"t":"T23","q":"Según Rovere y Pavón, ¿cómo se denomina el sistema abierto, multicéntrico y dinámico formado por actores, grupos e instituciones heterogéneos que se organizan horizontalmente en torno a necesidades compartidas?","a":"Red social","alts":["Red social"]},{"t":"T23","q":"Según Rovere y Pavón, ¿cómo se denomina la característica de la red que reemplaza la subordinación jerárquica por la toma de decisiones compartida?","a":"Heterarquía","alts":["Heterarquía"]},{"t":"T23","q":"Según Rovere y Pavón, ¿cómo se denomina la característica de la red por la cual cada nodo aporta saberes y capacidades distintas pero de igual valor operativo?","a":"Asimetría productiva","alts":["Asimetría productiva"]},{"t":"T23","q":"En la perspectiva de redes, ¿cómo se denominan las acciones concretas de auxilio y contención en situaciones de vulnerabilidad o emergencia?","a":"Apoyos","alts":["Apoyos"]},{"t":"T4","q":"¿Cómo se denomina el paradigma epistemológico y psicosocial según el cual todo conocimiento sobre lo real se edifica de manera colectiva a través de la interacción humana cotidiana?","a":"Construccionismo social","alts":["Construccionismo social"]},{"t":"T4","q":"¿Cómo se denomina la postura que presupone un orden natural e inamovible donde las características biológicas o sociales de una persona definen su destino, y que responde a la máxima \"donde caíste, quedaste\"?","a":"Determinismo","alts":["Determinismo"]},{"t":"T4","q":"¿Cómo se denomina el eje curricular de la currícula innovada en el que se enmarca la idea de que el saber médico se construye y no viene dado genéticamente?","a":"Construcción del Pensamiento Médico","alts":["Construcción del Pensamiento Médico"]},{"t":"T4","q":"¿Cómo se denomina la postura que toma lo biológico como causa única y excluyente, y con la cual rompe el construccionismo?","a":"Biologismo","alts":["Biologismo"]},{"t":"T4","q":"Según Berger y Luckmann, ¿cómo se denomina la realidad que se impone a la conciencia de manera masiva, urgente e imperiosa, y se organiza alrededor del aquí de mi cuerpo y el ahora de mi presente?","a":"Vida cotidiana (realidad suprema o por excelencia)","alts":["Vida cotidiana","Realidad suprema","Realidad por excelencia"]},{"t":"T4","q":"Según Berger y Luckmann, ¿cómo se denomina la actitud del sentido común que acepta la realidad cotidiana como dada, ordenada y evidente por sí misma, sin requerir verificaciones?","a":"Actitud natural","alts":["Actitud natural"]},{"t":"T4","q":"Según Berger y Luckmann, ¿cómo se denomina la experiencia prototípica de la interacción social, en la que las subjetividades se encuentran en un presente vívido y la expresividad del otro es masivamente accesible?","a":"Situación cara a cara","alts":["Situación cara a cara"]},{"t":"T4","q":"Según Berger y Luckmann, ¿cómo se denomina el carácter de la vida cotidiana como un mundo que se comparte con otros?","a":"Intersubjetividad (mundo intersubjetivo)","alts":["Intersubjetividad","mundo intersubjetivo"]},{"t":"T4","q":"Según Berger y Luckmann, ¿cuál es el instrumento objetivador por excelencia, capaz de separarse del aquí y ahora y funcionar como depósito de experiencias y significados?","a":"El lenguaje","alts":["El lenguaje"]},{"t":"T4","q":"Según Berger y Luckmann, ¿cómo se denomina el saber de sentido común compuesto por instrucciones pragmáticas para resolver problemas rutinarios, sin necesidad de dominar la explicación científica?","a":"Conocimiento de receta","alts":["Conocimiento de receta"]},{"t":"T4","q":"Según Berger y Luckmann, ¿cómo se denomina el proceso por el cual una acción repetida muchas veces se vuelve un hábito que ahorra esfuerzo y permite actuar sin pensar cada paso?","a":"Habituación","alts":["Habituación"]},{"t":"T4","q":"Según Berger y Luckmann, ¿cómo se denomina el proceso por el cual las costumbres habitualizadas se convierten en instituciones que las nuevas generaciones perciben como externas e impuestas?","a":"Institucionalización","alts":["Institucionalización"]},{"t":"T4","q":"Según Berger y Luckmann, ¿cómo se denomina el mecanismo que justifica el orden social explicando la razón de ser de cada regla y hace que las diferencias de poder parezcan naturales?","a":"Legitimación","alts":["Legitimación"]},{"t":"T4","q":"Según Berger y Luckmann, ¿hasta cuándo permanece no problemático el sector rutinario de la realidad cotidiana?","a":"Hasta nuevo aviso (hasta que aparece un problema o situación marginal)","alts":["Hasta nuevo aviso"]},{"t":"T4","q":"Según la cátedra, ¿qué concepto, cuya etimología griega significa cambio o transformación, rompe el equilibrio de las rutinas instituidas y abre paso a fuerzas instituyentes?","a":"Crisis","alts":["Crisis"]},{"t":"T4","q":"Según Berger y Luckmann, ¿cómo se denomina la aprehensión o interpretación inmediata de un acontecimiento objetivo en cuanto expresa significado, que convierte la realidad objetiva en subjetiva?","a":"Internalización","alts":["Internalización"]},{"t":"T4","q":"Según Berger y Luckmann, ¿cómo se denomina el proceso por el cual los productos de la actividad humana adquieren carácter externo y enfrentan a sus creadores como hechos independientes?","a":"Objetivación","alts":["Objetivación"]},{"t":"T4","q":"Según Berger y Luckmann, ¿cómo se denomina la permanente vertiente de la actividad humana en el mundo, mediante la cual el hombre crea productos materiales y simbólicos?","a":"Externalización","alts":["Externalización"]},{"t":"T4","q":"Según Berger y Luckmann, ¿cómo se denomina el aprendizaje mediante el cual una persona entra a formar parte de la vida en sociedad?","a":"Socialización","alts":["Socialización"]},{"t":"T4","q":"Según Berger y Luckmann, ¿cómo se denomina la etapa de socialización de la primera infancia, la más trascendental, que se da con un fuerte lazo afectivo y en la que el mundo transmitido aparece como el único posible?","a":"Socialización primaria","alts":["Socialización primaria"]},{"t":"T4","q":"Según Berger y Luckmann, ¿cómo se denomina a los padres o cuidadores que, con un fuerte lazo afectivo, transmiten el mundo al niño durante la socialización primaria?","a":"Otros significantes","alts":["Otros significantes"]},{"t":"T4","q":"Según Berger y Luckmann, ¿cómo se denomina la internalización de la sociedad como totalidad organizada, que permite superar la referencia exclusiva a personas concretas y participar de un mundo social compartido?","a":"Otro generalizado","alts":["Otro generalizado"]},{"t":"T4","q":"Según Berger y Luckmann, ¿cómo se denomina el aprendizaje posterior, sin gran carga afectiva y con instructores intercambiables, que integra a la persona en entornos específicos como una profesión?","a":"Socialización secundaria","alts":["Socialización secundaria"]},{"t":"T4","q":"Según Berger y Luckmann, ¿cómo se denomina el mantenimiento de la realidad subjetiva que se da mediante la interacción diaria y el diálogo informal con los otros significantes y el coro de conocidos?","a":"Mantenimiento de rutina","alts":["Mantenimiento de rutina"]},{"t":"T4","q":"Según Berger y Luckmann, ¿cómo se denomina el proceso de transformación casi total de la realidad subjetiva, que simula la intensidad de la socialización primaria y reinterpreta la biografía en términos de un antes y un después?","a":"Alternación (resocialización)","alts":["Alternación","resocialización"]},{"t":"T4","q":"Según Berger y Luckmann, ¿cómo se denomina la base social, como una comunidad, que confirma la nueva identidad y es imprescindible para sostener una alternación?","a":"Estructura de plausibilidad","alts":["Estructura de plausibilidad"]},{"t":"T4","q":"¿Cómo se denomina el conjunto de reglas, discursos, prácticas e instituciones que va guiando la forma en que actuamos y vemos el mundo?","a":"Dispositivo (social)","alts":["Dispositivo","Dispositivo social"]},{"t":"T4","q":"Según la cátedra, ¿cómo se concibe al diagnóstico médico cuando se afirma que no es una lectura neutra del cuerpo sino una interpretación influida por valores, teorías e ideologías?","a":"Una construcción discursiva (construcción de ideas)","alts":["Una construcción discursiva","construcción de ideas"]},{"t":"T4","q":"En el análisis de Náufrago, ¿qué función del otro en la constitución de la subjetividad ilustra la relación del protagonista con la pelota Wilson y su pérdida en el océano?","a":"Función especular del otro","alts":["Función especular del otro"]},{"t":"T4","q":"¿Qué concepto ilustra la escena del suéter azul de El diablo viste a la moda, en la que una elección estética vivida como libre resulta programada por la industria?","a":"Creación de deseo (dispositivos culturales / ilusión de autopercepción)","alts":["Creación de deseo","Dispositivos culturales","Ilusión de autopercepción"]},{"t":"T4","q":"En el análisis de Nosedive (Black Mirror), ¿cómo se denomina la estética que muestran las relaciones humanas alienadas por la búsqueda de calificaciones y likes?","a":"Estética de la impostura","alts":["Estética de la impostura"]},{"t":"T5","q":"¿Cómo se denomina la rama de la filosofía encargada de estudiar la organización, fundamentación y validación del conocimiento científico?","a":"Epistemología","alts":["Epistemología"]},{"t":"T5","q":"¿Cómo se denomina el nivel de conocimiento más abstracto, formal e intelectual, que corresponde a las ideas, las hipótesis, las ciencias básicas y los modelos teóricos falsables?","a":"Episteme","alts":["Episteme"]},{"t":"T5","q":"¿Cómo se denomina el nivel de conocimiento que alude al procedimiento reglado y al saber hacer instrumental, que simplifica las acciones para no tener que racionalizar la teoría de cada movimiento?","a":"Tekné (técnica)","alts":["Tekné","técnica"]},{"t":"T5","q":"¿Cómo se denomina el nivel de conocimiento formado por opiniones, creencias sin fundamentación científica y sentido común, que carece de articulación conceptual?","a":"Doxa (conocimiento vulgar)","alts":["Doxa","conocimiento vulgar"]},{"t":"T5","q":"¿Cómo se denomina el nivel de conocimiento que unifica la episteme y la tekné, entendido como la aplicación transformadora, consciente y ética de un saber fundamentado sobre una realidad concreta?","a":"Praxis","alts":["Praxis"]},{"t":"T5","q":"Según la cátedra (gráfico de Areta), ¿cómo se denomina el modelo que explica por qué la medicina no es ciencia, técnica, arte ni religión, sino praxis?","a":"Nudo de la medicina como práctica (nudo borromeo)","alts":["Nudo de la medicina como práctica","nudo borromeo"]},{"t":"T5","q":"Según la cátedra, ¿cuál es el valor supremo de la medicina clínica, que la diferencia de la ciencia pura cuyo objetivo es evaluar la efectividad de una teoría?","a":"El altruismo (el alivio del sufrimiento y la curación del enfermo)","alts":["El altruismo","el alivio del sufrimiento y la curación del enfermo"]},{"t":"T5","q":"Según la cátedra, ¿cómo se denomina la capacidad del médico de adaptar técnicas en situaciones de escasez o urgencia, como improvisar una férula con un bajalenguas?","a":"Creatividad médica","alts":["Creatividad médica"]},{"t":"T5","q":"Según Thomas Kuhn, ¿cómo se denominan los marcos teóricos y prácticos temporales que cambian y se corrigen con las épocas, y en los que se basa la medicina a diferencia de los dogmas religiosos?","a":"Paradigmas (científicos)","alts":["Paradigmas","Paradigma","Paradigmas científicos"]},{"t":"T5","q":"¿Qué término griego, que significa inclinarse ante el paciente que sufre, da origen a la palabra clínica?","a":"Kliné","alts":["Kliné"]},{"t":"T5","q":"¿Cómo se denomina el tiempo del acto médico dedicado a la reflexión, la revisión bibliográfica, los ateneos y los pases de sala?","a":"Tiempo teórico","alts":["Tiempo teórico"]},{"t":"T5","q":"Según la cátedra, ¿qué es lo que verdaderamente constituye al médico, más allá de la habilitación legal que otorga el título?","a":"El acto ético (la responsabilidad de cada acto médico / la praxis)","alts":["Acto ético","La responsabilidad de cada acto médico","Praxis","El acto médico"]},{"t":"T5","q":"¿Cómo se denomina el discurso en el que el médico asume una posición de omnipotencia y superioridad, elevando sus opiniones personales a verdades científicas indiscutibles?","a":"Discurso médico hegemónico","alts":["Discurso médico hegemónico"]},{"t":"T5","q":"¿Qué sanitarista argentino, pionero de la salud pública nacional, afirmó que \"solo sirven las conquistas científicas sobre la salud si estas son accesibles al pueblo\"?","a":"Ramón Carrillo","alts":["Ramón Carrillo"]},{"t":"T5","q":"Según Foucault, ¿cómo se denomina el conjunto de códigos fundamentales, esquemas de pensamiento y relaciones de poder-saber que rigen en una cultura durante un período histórico, marcando la frontera entre lo verdadero y lo falso?","a":"Episteme epocal","alts":["Episteme epocal"]},{"t":"T5","q":"En el ejemplo de episteme epocal, ¿cómo se denomina a las personas nacidas en la cultura del papel que debieron adaptarse al lenguaje digital en la adultez?","a":"Migrantes digitales","alts":["Migrantes digitales"]},{"t":"T5","q":"¿Cómo se denomina el procedimiento que articula la episteme con la clínica y cuya omisión llevó a tratar como sinusitis a una paciente con neuralgia del trigémino?","a":"Diagnóstico diferencial","alts":["Diagnóstico diferencial"]},{"t":"T5","q":"En psicoanálisis, ¿cómo se denomina el complejo que explica cómo la pulsión biológica del niño o niña se conecta con el lazo social y la estructura familiar, y que se resuelve por la represión?","a":"Complejo de Edipo","alts":["Complejo de Edipo"]},{"t":"T5","q":"¿Cómo se denomina la operación psíquica, no originada en un trauma exterior, que constituye el núcleo de lo reprimido inconsciente y resuelve el Edipo junto con la amnesia infantil?","a":"Represión","alts":["Represión"]},{"t":"T5","q":"En psicoanálisis, ¿cómo se denomina la metáfora simbólica introducida por la función paterna que transmite que \"no todo es posible\" y marca un límite al deseo incestuoso?","a":"Complejo (amenaza) de castración","alts":["Complejo de castración","Amenaza de castración","Castración"]}];
const LABEL = {T1:"Teórico 1",T23:"Teóricos 2 y 3",T4:"Teórico 4",T5:"Teórico 5"};
const TANDAS = [[101,2,3,5,1,0,99,102,95,80,59,54,74,75,43,37,112,114,115,125],[113,72,71,69,96,97,91,92,7,12,50,51,49,65,66,63,76,104,116,81],[41,42,46,47,48,44,52,58,57,61,62,64,56,77,32,33,84,85,86,100],[105,98,90,89,87,88,106,83,123,119,111,128,130,129,34,36,78,8,14,10],[4,18,17,27,13,9,6,20,38,39,40,45,55,67,68,70,73,79,94,103],[107,29,109,108,110,93,82,122,120,121,117,118,127,126,35,60,53,11,15,16],[19,21,22,23,24,25,26,28,30,31,124]];
const NIVEL = ["Imprescindibles","Muy importantes","Importantes","Importantes","Complementarias","Complementarias","Detalles y datos puntuales"];
const DESC = ["Los conceptos centrales de cada autor: si no sabés estos, no aprobás.","Segundo círculo de conceptos clave de cada teórico.","Conceptos que suelen aparecer como consigna.","Conceptos de apoyo que completan cada teoría.","Distinciones finas y términos secundarios.","Ejemplos, películas y aplicaciones a la medicina.","Nombres propios, fechas y ejemplos puntuales."];
const PASS = 0.6;
let tanda = 0; const hist = {};

const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9ñ ]/g," ").replace(/\b(el|la|lo|los|las|un|una|de|del)\b/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function matches(user, alts){
  const u = norm(user); if(u.length<3) return false;
  return alts.some(a=>{const x=norm(a); if(!x) return false;
    if(u===x) return true;
    if(u.includes(x) && x.length>=4) return true;
    if(x.includes(u) && u.length>=Math.max(4,x.length*0.6)) return true;
    const tol = x.length>=12?3:x.length>=6?2:1;
    return lev(u,x)<=tol;
  });
}
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

let exam=[], mode="mc", graded=false;
let ans = {mc:{}, wr:{}}, override = {};
let armed = false;

function build(k){
  if(k!==undefined) tanda=k;
  const picked=TANDAS[tanda].map(i=>BANK[i]);
  exam = picked.map(b=>{
    const same = shuffle(BANK.filter(o=>o.t===b.t && norm(o.a)!==norm(b.a)));
    const others = shuffle(BANK.filter(o=>o.t!==b.t));
    const d=[]; for(const o of [...same,...others]){ if(d.length===3)break; if(!d.some(x=>norm(x)===norm(o.a))) d.push(o.a); }
    return {...b, opts: shuffle([b.a,...d])};
  });
  ans={mc:{},wr:{}}; override={}; graded=false; armed=false;
  render(); window.scrollTo({top:0});
}

function isRight(i){
  const q=exam[i];
  if(mode==="mc") return ans.mc[i]===q.a;
  if(override[i]!==undefined) return override[i];
  return matches(ans.wr[i], q.alts);
}
const answered = () => exam.filter((_,i)=> mode==="mc" ? ans.mc[i]!==undefined : (ans.wr[i]||"").trim()!=="").length;

function el(tag, attrs={}, ...kids){const e=document.createElement(tag);for(const k in attrs){if(k==="class")e.className=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k])}
  kids.flat().forEach(c=>e.append(c instanceof Node?c:document.createTextNode(c)));return e}

function render(){
  document.getElementById("m-mc").setAttribute("aria-pressed", mode==="mc");
  document.getElementById("m-wr").setAttribute("aria-pressed", mode==="wr");
  document.getElementById("modehint").textContent = mode==="mc"
    ? "Elegí una de las cuatro opciones en cada consigna."
    : "Escribí solo el nombre del concepto. Se aceptan pequeños errores de tipeo; si la corrección automática no te da una respuesta que era válida, podés contarla como correcta.";
  const ol=document.getElementById("qs"); ol.textContent="";
  exam.forEach((q,i)=>{
    const li=el("li",{class:"q"+(graded?(isRight(i)?" right":" wrong"):""), id:"q"+i});
    li.append(el("div",{class:"qhead"}, el("span",{class:"num"}, String(i+1).padStart(2,"0")), el("span",{class:"chip"}, LABEL[q.t])));
    li.append(el("p",{class:"qtext"}, q.q));
    if(mode==="mc"){
      const box=el("div",{class:"opts",role:"radiogroup","aria-label":"Opciones de la consigna "+(i+1)});
      q.opts.forEach((o,k)=>{
        const sel = ans.mc[i]===o;
        let cls="opt"; if(graded){ if(o===q.a) cls+=" is-right"; else if(sel) cls+=" is-wrong"; }
        const b=el("button",{type:"button",class:cls,role:"radio","aria-checked":sel, onclick:()=>{ if(graded)return; ans.mc[i]=o; armed=false; render(); }},
          el("span",{class:"k"},"abcd"[k]+")"), el("span",{},o));
        if(graded) b.disabled=true;
        box.append(b);
      });
      li.append(box);
    } else {
      const inp=el("input",{type:"text",id:"w"+i,autocomplete:"off",spellcheck:"false",placeholder:"Escribí el concepto","aria-label":"Respuesta de la consigna "+(i+1)});
      inp.value=ans.wr[i]||"";
      inp.addEventListener("input",e=>{ans.wr[i]=e.target.value; armed=false; updateBar();});
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const n=document.getElementById("w"+(i+1)); if(n) n.focus(); }});
      if(graded) inp.disabled=true;
      li.append(el("div",{class:"write"},inp));
    }
    if(graded){
      const ok=isRight(i), fb=el("div",{class:"fb"});
      fb.append(el("span",{class:"tag "+(ok?"ok":"bad")}, ok?"Correcta":"Incorrecta"));
      if(!ok || mode==="wr") fb.append(el("span",{class:"exp"}, "Respuesta esperada: ", el("b",{}, q.a)));
      if(mode==="wr"){
        const auto=matches(ans.wr[i],q.alts);
        fb.append(el("button",{type:"button",class:"linkbtn",onclick:()=>{ override[i]=!ok; if(override[i]===auto) delete override[i]; render(); }},
          ok?"Contar como incorrecta":"Mi respuesta era válida"));
      }
      li.append(fb);
    }
    ol.append(li);
  });
  renderTandas(); renderResults(); updateBar();
}

function renderResults(){
  const r=document.getElementById("results");
  if(!graded){ r.hidden=true; r.textContent=""; return; }
  const N=exam.length, tot=exam.filter((_,i)=>isRight(i)).length, pct=Math.round(tot/N*100), pass=tot/N>=PASS; hist[tanda+"_"+mode]=pass; renderTandas();
  r.hidden=false; r.textContent="";
  r.append(el("div",{class:"score"}, el("span",{class:"big"}, `${tot}/${N}`), el("span",{class:"pct"}, `${pct} %`),
    el("span",{class:"verdict "+(pass?"ok":"bad")}, pass?"Aprobado":"No aprobado")));
  const m=el("div",{class:"meter"}, el("div",{class:"fill",style:`width:${pct}%`}), el("div",{class:"mark",title:"60 %"}));
  r.append(m, el("div",{class:"meter-l"}, el("span",{},"0"), el("span",{},"60 % para aprobar"), el("span",{},"100 %")));
  const bd=el("div",{class:"bd"});
  for(const t in LABEL){ const idx=exam.map((q,i)=>q.t===t?i:-1).filter(i=>i>=0); if(!idx.length) continue; const ok=idx.filter(isRight).length;
    bd.append(el("div",{}, el("div",{class:"n"}, `${ok}/${idx.length}`), el("div",{class:"l"}, LABEL[t]))); }
  r.append(bd);
  if(mode==="wr") r.append(el("p",{class:"note"},"En modo escrito la corrección es automática y tolera errores de tipeo. Revisá cada consigna: si escribiste un sinónimo válido, tocá “Mi respuesta era válida” y el puntaje se actualiza."));
  r.append(el("div",{class:"actions"},
    el("button",{type:"button",class:"btn primary",onclick:()=>{ ans[mode]={}; override={}; graded=false; armed=false; render(); window.scrollTo({top:0}); }},"Reintentar las mismas consignas"),
    tanda<TANDAS.length-1 ? el("button",{type:"button",class:"btn",onclick:()=>build(tanda+1)},`Pasar a la tanda ${tanda+2}`) : el("span",{class:"note"},"Terminaste las 7 tandas."),
    el("button",{type:"button",class:"btn",onclick:()=>build(0)},"Reiniciar desde la tanda 1")));
}

function updateBar(){
  const a=answered(), N=exam.length;
  document.getElementById("progt").textContent = graded ? "Simulacro corregido" : `Respondidas ${a} de ${N}`;
  document.getElementById("progbar").style.width = (a/N*100)+"%";
  const b=document.getElementById("entregar");
  if(graded){ b.textContent="Ver resultado"; return; }
  b.textContent = armed ? `Entregar igual (faltan ${N-a})` : "Entregar";
}

document.getElementById("entregar").addEventListener("click",()=>{
  if(graded){ document.getElementById("results").scrollIntoView({behavior:"smooth"}); return; }
  const a=answered(), N=exam.length;
  if(a<N && !armed){ armed=true; updateBar(); return; }
  graded=true; armed=false; render();
  document.getElementById("results").scrollIntoView({behavior:"smooth"});
});
function setMode(m){ if(m===mode)return; mode=m; graded=false; armed=false; override={}; render(); }
document.getElementById("m-mc").addEventListener("click",()=>setMode("mc"));
document.getElementById("m-wr").addEventListener("click",()=>setMode("wr"));
const restart=()=>{ Object.keys(hist).forEach(k=>delete hist[k]); build(0); };
document.getElementById("reiniciar").addEventListener("click",restart);
document.getElementById("reiniciar2").addEventListener("click",restart);
function renderTandas(){
  const row=document.getElementById("trow"); row.textContent="";
  TANDAS.forEach((_,k)=>{
    const h=hist[k+"_"+mode]; const b=el("button",{type:"button","aria-current":k===tanda,"aria-label":`Tanda ${k+1}: ${NIVEL[k]}`,class:h===true?"done-ok":h===false?"done-bad":"",onclick:()=>build(k)}, String(k+1));
    row.append(b);
  });
  const n=document.getElementById("tname"); n.textContent="";
  n.append(el("b",{},`Tanda ${tanda+1} de ${TANDAS.length} · ${NIVEL[tanda]}`), " ", el("span",{},`(${TANDAS[tanda].length} consignas) ${DESC[tanda]}`));
}
build(0);
</script>
