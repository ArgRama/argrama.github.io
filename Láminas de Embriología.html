<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Láminas de Embriología</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: menú de láminas en grilla → cada actividad abre con pestañas; lámina con rótulos tapados a la izquierda, hoja de respuestas a la derecha */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18222d; --muted:#5b6876; --line:#d9dfe6;
  --venous:#2f6fb0; --arterial:#c43a31; --accent:#1f5f8f; --accent-soft:#e3eef7;
  --ok:#1e7a46; --ok-soft:#e2f3e8; --bad:#b3261e; --bad-soft:#fbe7e5; --reveal:#8a5a00; --reveal-soft:#fbf0d9;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171d; --surface:#1a222b; --ink:#e7edf3; --muted:#9aa8b6; --line:#2d3946;
  --venous:#6aa5e0; --arterial:#ec7b72; --accent:#7fb6e3; --accent-soft:#1d3245;
  --ok:#5fcf8c; --ok-soft:#173726; --bad:#f08a82; --bad-soft:#3e1d1b; --reveal:#e6b55c; --reveal-soft:#3a2e15;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171d; --surface:#1a222b; --ink:#e7edf3; --muted:#9aa8b6; --line:#2d3946;
  --venous:#6aa5e0; --arterial:#ec7b72; --accent:#7fb6e3; --accent-soft:#1d3245;
  --ok:#5fcf8c; --ok-soft:#173726; --bad:#f08a82; --bad-soft:#3e1d1b; --reveal:#e6b55c; --reveal-soft:#3a2e15;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:24px 48px}
header{margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,38px);line-height:1.1;margin:4px 0 6px;text-wrap:balance}
h1 .v{color:var(--venous)} h1 .a{color:var(--arterial)}
.lede{margin:0;color:var(--muted);max-width:66ch}
.back{appearance:none;border:0;background:none;color:var(--accent);font:700 14px var(--body);padding:4px 0;cursor:pointer;margin-bottom:8px}
.back:hover{text-decoration:underline}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* menú */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{appearance:none;text-align:left;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;color:var(--ink);font:inherit;padding:0;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .thumb{position:relative;background:#fff;aspect-ratio:16/10;border-bottom:1px solid var(--line);max-width:100%}
.card .thumb img{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);max-width:none;object-fit:contain}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.card .tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card h2{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2;margin:0;text-wrap:balance}
.card .meta{font-size:14px;color:var(--muted)}
.card .prog{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .prog .bar{flex:1}
.count{font-size:14px;color:var(--muted);margin:0 0 14px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:700 15px var(--body);padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .sc{font-weight:400;font-variant-numeric:tabular-nums;margin-left:6px;font-size:13px}

.panel{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.panel{grid-template-columns:minmax(0,1fr)}}
.figure{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
@media (max-width:860px){.figure{position:static}}
.stage{position:relative;container-type:inline-size;line-height:0}
.stage img{display:block;width:100%;height:auto}
.box{position:absolute;display:flex;align-items:center;justify-content:center;gap:.4em;background:#fff;border:1.5px dashed #9aa6b2;border-radius:4px;cursor:pointer;padding:0 .3em;line-height:1.1;font-family:var(--body);color:#18222d;font-size:var(--fs,1.85cqw);text-align:center;transition:background .15s,border-color .15s}
.box:hover{background:#eef4fa}
.box .n{flex:none;display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;border-radius:999px;background:#1f5f8f;color:#fff;font-weight:700;font-size:.95em;font-variant-numeric:tabular-nums}
.box .t{display:none;font-weight:700}
.box.active{border-style:solid;border-color:#1f5f8f;background:#e3eef7}
.box.ok{border-style:solid;border-color:#1e7a46;background:#e9f6ee}
.box.ok .n{background:#1e7a46} .box.ok .t{display:inline;color:#1e7a46}
.box.bad{border-style:solid;border-color:#b3261e;background:#fdeeed}
.box.bad .n{background:#b3261e}
.box.rev{border-style:solid;border-color:#8a5a00;background:#fdf4e1}
.box.rev .n{background:#8a5a00} .box.rev .t{display:inline;color:#8a5a00}
.box.peek{background:transparent;border-color:transparent}
.box.peek > *{visibility:hidden}
.figcap{font-size:13px;color:#5b6876;line-height:1.4;margin:8px 4px 2px}

.sheet{display:flex;flex-direction:column;gap:14px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 14px var(--body);padding:8px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.score{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--muted)}
.score b{color:var(--ink);font-size:20px}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.bank{display:flex;flex-wrap:wrap;gap:6px;padding:12px;border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
.bank .lbl{width:100%;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chip{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:400 14px var(--body);padding:4px 10px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.used{opacity:.4;text-decoration:line-through}
ol.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.item .n{display:inline-grid;place-items:center;width:2em;height:2em;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.item input{width:100%;min-width:0;font:400 16px var(--body);color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--line);padding:4px 2px}
.item input:focus{outline:none;border-bottom-color:var(--accent)}
.item .st{font-size:13px;font-weight:700;white-space:nowrap}
.item.active{border-color:var(--accent)}
.item.ok{border-color:var(--ok);background:var(--ok-soft)} .item.ok .n{background:var(--ok);color:var(--surface)} .item.ok .st{color:var(--ok)}
.item.bad{border-color:var(--bad);background:var(--bad-soft)} .item.bad .n{background:var(--bad);color:var(--surface)} .item.bad .st{color:var(--bad)}
.item.rev{border-color:var(--reveal);background:var(--reveal-soft)} .item.rev .n{background:var(--reveal);color:var(--surface)} .item.rev .st{color:var(--reveal)}
.item .fix{grid-column:2 / -1;font-size:13px;color:var(--muted)}
.note{font-size:14px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0}
.note b{color:var(--ink)}

.mwrap{max-width:820px;display:flex;flex-direction:column;gap:14px}
.match{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1.1fr);gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
@media (max-width:560px){.mrow{grid-template-columns:minmax(0,1fr)}.mrow .arr{display:none}}
.mrow .fet{font-weight:700}
.mrow .fet small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.mrow .arr{color:var(--muted);text-align:center}
.mrow select{width:100%;font:400 15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.mrow.ok{border-color:var(--ok);background:var(--ok-soft)}
.mrow.bad{border-color:var(--bad);background:var(--bad-soft)}
.mrow.rev{border-color:var(--reveal);background:var(--reveal-soft)}
.mrow .why{grid-column:1 / -1;font-size:14px;color:var(--muted);display:none}
.mrow.ok .why,.mrow.bad .why,.mrow.rev .why{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

},

/* ---------- utilidades ---------- */
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9 ]/g," ").replace(/\b(el|la|los|las|del|de)\b/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function grade(val, alts){
  const v=norm(val); if(!v) return "empty";
  for(const alt of alts){const t=norm(alt); if(v===t) return "ok";
    const tol=t.length>12?2:t.length>6?1:0; if(lev(v,t)<=tol) return "ok";}
  return "bad";
}
const shuffle = a => {a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};

/* puntajes de la sesión: SCORES[actId][tabKey] = {ok,total} */
const SCORES={};
ACTIVITIES.forEach(a=>{SCORES[a.id]={};a.tabs.forEach(t=>SCORES[a.id][t.key]={ok:0,total:t.type==="label"?t.items.length:t.rows.length})});
const views={}; // vistas ya construidas (conservan lo escrito al volver al menú)
const app=document.getElementById("app");

/* ---------- menú ---------- */
const home=el("div");
function renderHome(){
  home.innerHTML=`<header><div class="eyebrow">FSH · Concepción y formación del ser humano</div>
    <h1>Láminas para completar</h1>
    <p class="lede">Elegí una lámina. Lo que vayas completando se mantiene mientras no recargues la página, así que podés ir y volver entre actividades.</p></header>
    <p class="count">${ACTIVITIES.length} actividades</p>`;
  const g=el("div","grid");
  ACTIVITIES.forEach(a=>{
    const tot=Object.values(SCORES[a.id]).reduce((s,x)=>({ok:s.ok+x.ok,total:s.total+x.total}),{ok:0,total:0});
    const nLab=a.tabs.filter(t=>t.type==="label").reduce((s,t)=>s+t.items.length,0);
    const c=el("button","card"); c.type="button";
    c.innerHTML=`<div class="thumb"><img src="${a.thumb}" alt=""></div>
      <div class="body"><span class="tag">${a.tag}</span><h2>${a.title}</h2>
      <span class="meta">${nLab} rótulos · ${a.tabs.length} ${a.tabs.length===1?"parte":"partes"}</span>
      <div class="prog"><div class="bar"><i style="width:${tot.ok/tot.total*100}%"></i></div><span>${tot.ok}/${tot.total}</span></div></div>`;
    c.onclick=()=>go(a.id);
    g.appendChild(c);
  });
  home.appendChild(g);
}

/* ---------- actividad ---------- */
function buildActivity(a){
  const v=el("div");
  const back=el("button","back","← Todas las láminas"); back.type="button"; back.onclick=()=>go("");
  const hd=el("header");
  hd.innerHTML=`<div class="eyebrow">${a.tag}</div><h1>${a.titleHTML||a.title}</h1><p class="lede">${a.lede}</p>`;
  const tabs=el("div","tabs"); tabs.setAttribute("role","tablist");
  v.append(back,hd,tabs);
  const panels=a.tabs.map((t,i)=>{
    const b=el("button","tab",`${t.label}<span class="sc"></span>`); b.type="button"; b.setAttribute("role","tab");
    b.setAttribute("aria-selected",String(i===0)); tabs.appendChild(b);
    const p=t.type==="label"?buildLabel(a,t,b.querySelector(".sc")):buildMatch(a,t,b.querySelector(".sc"));
    p.hidden=i!==0; v.appendChild(p);
    b.onclick=()=>{tabs.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===b)));panels.forEach(x=>x.hidden=x!==p)};
    return p;
  });
  if(a.tabs.length<2) tabs.hidden=true;
  return v;
}

function buildLabel(act,d,tabScore){
  const P=el("section","panel");
  const fig=el("div","figure"), stage=el("div","stage");
  if(d.fs) stage.style.setProperty("--fs",d.fs);
  const img=el("img"); img.src=d.img; img.alt=d.cap; stage.appendChild(img);
  fig.appendChild(stage); fig.appendChild(el("p","figcap",d.cap));

  const sheet=el("div","sheet");
  const tb=el("div","toolbar");
  const bCheck=el("button","btn primary","Corregir"), bBank=el("button","btn","Banco de palabras"),
        bPeek=el("button","btn","Ver lámina original"), bRev=el("button","btn","Ver respuestas"), bReset=el("button","btn","Reiniciar");
  bBank.setAttribute("aria-pressed","false"); bPeek.setAttribute("aria-pressed","false");
  const score=el("span","score");
  [bCheck,bBank,bPeek,bRev,bReset,score].forEach(b=>tb.appendChild(b));
  const bar=el("div","bar"); const barI=el("i"); bar.appendChild(barI);
  const bank=el("div","bank"); bank.hidden=true;
  const list=el("ol","items");
  sheet.append(tb,bar,bank,list);
  sheet.appendChild(el("p","note","<b>Tip:</b> tocá un número en la lámina para ir a su casillero. Al corregir, los aciertos aparecen escritos sobre la imagen. Se aceptan sinónimos y pequeños errores de tipeo; tildes y mayúsculas no cuentan."));
  P.append(fig,sheet);

  const rows=d.items.map((it,i)=>{
    const [x,y,w,h]=it.r;
    const box=el("button","box"); box.type="button";
    Object.assign(box.style,{left:x/d.w*100+"%",top:y/d.h*100+"%",width:w/d.w*100+"%",height:h/d.h*100+"%"});
    box.innerHTML=`<span class="n">${i+1}</span><span class="t">${it.a[0]}</span>`;
    box.setAttribute("aria-label","Rótulo "+(i+1));
    stage.appendChild(box);
    const li=el("li","item");
    li.innerHTML=`<span class="n">${i+1}</span><input id="${act.id}-${d.key}-${i+1}" autocomplete="off" spellcheck="false" placeholder="Nombre de la estructura" aria-label="Respuesta ${i+1}"><span class="st"></span>`;
    list.appendChild(li);
    const inp=li.querySelector("input");
    const row={it,box,li,inp,st:li.querySelector(".st")};
    box.addEventListener("click",()=>{inp.focus();inp.scrollIntoView({block:"nearest",behavior:"smooth"})});
    inp.addEventListener("focus",()=>{box.classList.add("active");li.classList.add("active");lastFocus=inp});
    inp.addEventListener("blur",()=>{box.classList.remove("active");li.classList.remove("active")});
    inp.addEventListener("input",()=>{if(!row.revealed)setState(row,null);updateBank();updateScore()});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();check(row);const nx=rows[i+1];if(nx)nx.inp.focus();else checkAll()}});
    return row;
  });
  let lastFocus=rows[0].inp;

  function setState(r,s){
    r.box.classList.remove("ok","bad","rev"); r.li.classList.remove("ok","bad","rev");
    const f=r.li.querySelector(".fix"); if(f) f.remove();
    if(!s){r.st.textContent="";return}
    r.box.classList.add(s); r.li.classList.add(s);
    r.st.textContent = s==="ok"?"✓ Correcto":s==="bad"?"✗ Revisar":"Respuesta";
    if(s==="rev") r.li.appendChild(el("div","fix","Era: <b>"+r.it.a[0]+"</b>"));
    else if(s==="ok"&&norm(r.inp.value)!==norm(r.it.a[0])) r.li.appendChild(el("div","fix","Nombre en la lámina: <b>"+r.it.a[0]+"</b>"));
  }
  function check(r){ if(r.revealed) return; const g=grade(r.inp.value,r.it.a); setState(r,g==="empty"?null:g); updateScore() }
  function checkAll(){ rows.forEach(check); const nb=rows.find(r=>r.li.classList.contains("bad")||(!r.inp.value&&!r.revealed)); if(nb) nb.inp.focus({preventScroll:true}) }
  function updateScore(){
    const ok=rows.filter(r=>r.li.classList.contains("ok")).length;
    score.innerHTML=`<b>${ok}</b> / ${rows.length}`;
    barI.style.width=ok/rows.length*100+"%";
    tabScore.textContent=ok?`${ok}/${rows.length}`:"";
    SCORES[act.id][d.key].ok=ok;
  }

  const names=[...new Set(d.items.map(i=>i.a[0]))];
  function buildBank(){
    bank.innerHTML='<span class="lbl">Tocá una palabra para ponerla en el casillero activo</span>';
    shuffle(names).forEach(nm=>{const c=el("button","chip",nm);c.type="button";c.dataset.n=nm;
      c.addEventListener("mousedown",e=>e.preventDefault());
      c.addEventListener("click",()=>{const t=lastFocus||rows[0].inp;t.value=nm;t.dispatchEvent(new Event("input"));
        const idx=rows.findIndex(r=>r.inp===t); const nx=rows.slice(idx+1).find(r=>!r.inp.value)||rows.find(r=>!r.inp.value); (nx?nx.inp:t).focus()});
      bank.appendChild(c)});
    updateBank();
  }
  function updateBank(){
    const counts={}; d.items.forEach(i=>counts[i.a[0]]=(counts[i.a[0]]||0)+1);
    rows.forEach(r=>{const v=norm(r.inp.value);names.forEach(nm=>{if(norm(nm)===v)counts[nm]--})});
    bank.querySelectorAll(".chip").forEach(c=>c.classList.toggle("used",counts[c.dataset.n]<=0));
  }
  buildBank();

  bCheck.onclick=checkAll;
  bBank.onclick=()=>{bank.hidden=!bank.hidden;bBank.setAttribute("aria-pressed",String(!bank.hidden))};
  bPeek.onclick=()=>{const on=bPeek.getAttribute("aria-pressed")!=="true";bPeek.setAttribute("aria-pressed",String(on));
    bPeek.textContent=on?"Ocultar rótulos":"Ver lámina original";rows.forEach(r=>r.box.classList.toggle("peek",on))};
  bRev.onclick=()=>{rows.forEach(r=>{if(grade(r.inp.value,r.it.a)!=="ok"){r.revealed=true;setState(r,"rev")}else setState(r,"ok")});updateScore()};
  bReset.onclick=()=>{rows.forEach(r=>{r.revealed=false;r.inp.value="";setState(r,null)});buildBank();updateScore();rows[0].inp.focus()};
  updateScore();
  return P;
}

function buildMatch(act,d,tabScore){
  const P=el("section","mwrap");
  P.appendChild(el("p","note",d.intro));
  const tb=el("div","toolbar");
  const bC=el("button","btn primary","Corregir"), bR=el("button","btn","Ver respuestas"), bZ=el("button","btn","Reiniciar"), score=el("span","score");
  tb.append(bC,bR,bZ,score); P.appendChild(tb);
  const M=el("div","match"); P.appendChild(M);
  const opts=[...new Set(d.rows.map(m=>m.a)),...(d.distractors||[])];
  const rows=shuffle(d.rows).map((m,i)=>{
    const r=el("div","mrow");
    r.innerHTML=`<div class="fet">${m.f}<small>${m.s}</small></div><div class="arr" aria-hidden="true">→</div>
      <select id="${act.id}-${d.key}-${i}" aria-label="${m.f}, ${m.s}"><option value="">Elegí…</option>${shuffle(opts).map(o=>`<option>${o}</option>`).join("")}</select>
      <div class="why"></div>`;
    M.appendChild(r);
    const sel=r.querySelector("select"); sel.addEventListener("change",()=>{r.classList.remove("ok","bad","rev");upd()});
    return {m,r,sel,why:r.querySelector(".why")};
  });
  function upd(){const ok=rows.filter(x=>x.r.classList.contains("ok")).length;score.innerHTML=`<b>${ok}</b> / ${rows.length}`;
    tabScore.textContent=ok?`${ok}/${rows.length}`:"";SCORES[act.id][d.key].ok=ok}
  bC.onclick=()=>{rows.forEach(x=>{x.r.classList.remove("ok","bad","rev");if(!x.sel.value)return;
    const ok=x.sel.value===x.m.a;x.r.classList.add(ok?"ok":"bad");x.why.innerHTML=(ok?"✓ ":"✗ Era: <b>"+x.m.a+"</b>. ")+x.m.why});upd()};
  bR.onclick=()=>{rows.forEach(x=>{if(!(x.sel.value===x.m.a&&x.r.classList.contains("ok"))){x.sel.value=x.m.a;x.r.classList.remove("ok","bad");x.r.classList.add("rev");x.why.innerHTML=x.m.why}});upd()};
  bZ.onclick=()=>{rows.forEach(x=>{x.sel.value="";x.r.classList.remove("ok","bad","rev")});upd()};
  upd();
  return P;
}

/* ---------- navegación (#circulacion, #tubo) ---------- */
function show(id){
  const a=ACTIVITIES.find(x=>x.id===id);
  app.innerHTML="";
  if(!a){renderHome();app.appendChild(home);}
  else{ if(!views[id]) views[id]=buildActivity(a); app.appendChild(views[id]); }
  window.scrollTo(0,0);
}
function go(id){ if(location.hash.slice(1)===id) show(id); else location.hash=id; }
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
